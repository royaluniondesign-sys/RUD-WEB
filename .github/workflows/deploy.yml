name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set git identity for Vercel (local only, not pushed)
        run: |
          git config user.email "royaluniondesign@gmail.com"
          git config user.name "RUD Studio"
          git commit --allow-empty --amend --reset-author --no-edit

      - name: Deploy to Vercel Production
        run: npx vercel@57.0.0 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
