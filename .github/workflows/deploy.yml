name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set git identity for Vercel (local only, not pushed)
        run: |
          git config user.email "royaluniondesign@gmail.com"
          git config user.name "RUD Studio"
          git commit --allow-empty --amend --reset-author --no-edit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Pull Vercel environment
        run: npx vercel@56.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel@56.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy prebuilt
        run: npx vercel@56.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
