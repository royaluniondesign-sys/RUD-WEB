<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo lead — RUD Studio</title>
</head>
<body style="margin:0;padding:0;background:#F7F5F1;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#F7F5F1;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

          <!-- Alert header -->
          <tr>
            <td style="background:#0A0908;border-radius:16px 16px 0 0;padding:20px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.18em;color:#7B68EE;">🎯 Nuevo lead capturado</span>
                  </td>
                  <td align="right">
                    <span style="font-size:11px;color:rgba(255,255,255,0.35);">{{timestamp}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Lead data -->
          <tr>
            <td style="background:white;border:1px solid #E2DDD7;border-top:none;padding:32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:12px;color:#9CA3AF;width:120px;">Nombre</td>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:14px;font-weight:700;color:#0A0908;">{{name}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:12px;color:#9CA3AF;">Email</td>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:14px;">
                    <a href="mailto:{{email}}" style="color:#0A0908;font-weight:600;text-decoration:none;">{{email}}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:12px;color:#9CA3AF;">Servicio</td>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:14px;color:#0A0908;">{{service}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:12px;color:#9CA3AF;">Presupuesto</td>
                  <td style="padding:10px 0;border-bottom:1px solid #F0EDE6;font-size:14px;color:#0A0908;">{{budget}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;font-size:12px;color:#9CA3AF;vertical-align:top;">Página</td>
                  <td style="padding:10px 0;font-size:12px;color:#6B7280;">{{page}}</td>
                </tr>
              </table>

              <!-- Message box -->
              <div style="margin-top:24px;background:#F7F5F1;border-radius:10px;padding:20px;">
                <p style="margin:0 0 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#9CA3AF;">Mensaje</p>
                <p style="margin:0;font-size:14px;color:#0A0908;line-height:1.7;white-space:pre-wrap;">{{message}}</p>
              </div>
            </td>
          </tr>

          <!-- Action -->
          <tr>
            <td style="background:#F0EDE6;border-radius:0 0 16px 16px;padding:20px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <p style="margin:0;font-size:13px;color:#6B7280;">
                      Responde directamente a
                      <a href="mailto:{{email}}" style="color:#0A0908;font-weight:700;text-decoration:none;">{{email}}</a>
                    </p>
                  </td>
                  <td align="right">
                    <a href="mailto:{{email}}" style="display:inline-block;padding:10px 20px;background:#0A0908;border-radius:9999px;font-size:13px;font-weight:700;color:white;text-decoration:none;white-space:nowrap;">
                      Responder →
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 0 0;">
              <p style="margin:0;font-size:11px;color:#C4BFB8;text-align:center;">
                RUD Studio · Internal lead notification · No replies to this address
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
